name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up MoonBit (nightly)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s nightly
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show MoonBit version
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check
        run: moon check --target all --deny-warn --warn-list +25+73

      - name: Check formatting
        run: moon fmt --check

      - name: Verify reference corpus
        run: |
          gem install --user-install liquid --version 5.4.0 --no-document
          ruby tools/reference_cases.rb --check

      - name: Test
        run: moon test --target all
